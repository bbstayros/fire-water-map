<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9f1d18">
  <title>Χάρτης Σημείων Υδροληψίας</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="icons/logo.svg" alt="Λογότυπο Συλλόγου">
      <div class="brand-text">
        <h1>Σύλλογος Εθελοντών Πυροπροστασίας Δασών Λουτρακίου - Περαχώρας</h1>
        <p>Χάρτης δεξαμενών, πυροσβεστικών κρουνών και σημείων υδροληψίας</p>
      </div>
    </div>

    <a class="admin-link" href="admin.html" aria-label="Μετάβαση στη διαχείριση">
      ⚙️ Διαχείριση
    </a>
  </header>

  <main class="map-shell">
    <div id="map" aria-label="Διαδραστικός χάρτης σημείων υδροληψίας"></div>

    <div class="map-toolbar" aria-label="Εργαλεία χάρτη">
      <button id="locationButton" class="tool-button primary" type="button">
        📍 Η θέση μου
      </button>

      <button id="fitPointsButton" class="tool-button" type="button">
        🗺️ Όλα τα σημεία
      </button>
    </div>

    <section class="legend" aria-label="Υπόμνημα">
      <h2>Υπόμνημα</h2>
      <div><img src="icons/hydrant.svg" alt=""> Κρουνός</div>
      <div><img src="icons/tank.svg" alt=""> Δεξαμενή</div>
      <div><img src="icons/water-source.svg" alt=""> Σημείο υδροληψίας</div>
    </section>

    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/points.js"></script>
  <script src="js/gps.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
