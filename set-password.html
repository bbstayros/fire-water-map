<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ορισμός κωδικού · Fire Water Map</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="admin-body">
  <main class="login-view">
    <form id="passwordForm" class="login-card">
      <img src="icons/logo.svg" class="login-logo" alt="">
      <h1>Ορισμός νέου κωδικού</h1>
      <p id="passwordIntro">Ολοκλήρωσε την πρόσκλησή σου και διάλεξε έναν ισχυρό κωδικό.</p>

      <label>Νέος κωδικός
        <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
      </label>
      <label>Επιβεβαίωση
        <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
      </label>

      <button id="savePassword" class="action-button primary full" type="submit">Αποθήκευση κωδικού</button>
      <div id="passwordMessage" class="form-message"></div>
      <a href="index.html" class="back-link">Επιστροφή στην εφαρμογή</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    (() => {
      const client = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      const form = document.getElementById('passwordForm');
      const message = document.getElementById('passwordMessage');
      const save = document.getElementById('savePassword');

      const setMessage = (text, error = false) => {
        message.textContent = text;
        message.classList.toggle('error', error);
      };

      async function ensureSession() {
        // Handles an auth-code redirect too, while invite links normally arrive
        // through the client-side auth flow handled by detectSessionInUrl.
        const params = new URLSearchParams(location.search);
        const code = params.get('code');
        if (code) {
          const { error } = await client.auth.exchangeCodeForSession(code);
          if (error) throw error;
          history.replaceState({}, document.title, location.pathname);
        }

        const { data, error } = await client.auth.getSession();
        if (error) throw error;
        if (!data.session) throw new Error('Η πρόσκληση δεν είναι πλέον έγκυρη ή έχει λήξει. Ζήτησε από το Κέντρο να στείλει νέα πρόσκληση.');
        return data.session;
      }

      ensureSession().catch(err => {
        setMessage(err.message || 'Δεν ήταν δυνατή η επιβεβαίωση της πρόσκλησης.', true);
        save.disabled = true;
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (password !== confirm) {
          setMessage('Οι κωδικοί δεν ταιριάζουν.', true);
          return;
        }
        try {
          save.disabled = true;
          setMessage('Αποθήκευση…');
          await ensureSession();
          const { error } = await client.auth.updateUser({ password });
          if (error) throw error;
          setMessage('Ο κωδικός αποθηκεύτηκε. Μεταφορά στην εφαρμογή…');
          setTimeout(() => location.replace('index.html'), 1200);
        } catch (err) {
          setMessage(err.message || 'Η αποθήκευση απέτυχε.', true);
          save.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
