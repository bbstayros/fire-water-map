<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ορισμός κωδικού · Fire Water Map</title><link rel="stylesheet" href="css/app.css"></head><body class="admin-body"><main class="login-view"><form id="passwordForm" class="login-card"><img src="icons/logo.svg" class="login-logo" alt=""><h1>Ορισμός νέου κωδικού</h1><p>Διάλεξε έναν ισχυρό κωδικό για τον λογαριασμό σου.</p><label>Νέος κωδικός<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label><label>Επιβεβαίωση<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label><button class="action-button primary full" type="submit">Αποθήκευση κωδικού</button><div id="passwordMessage" class="form-message"></div><a href="admin.html" class="back-link">Επιστροφή στη σύνδεση</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script>const client=supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey);document.getElementById('passwordForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('passwordMessage'),p=document.getElementById('newPassword').value;if(p!==document.getElementById('confirmPassword').value){m.textContent='Οι κωδικοί δεν ταιριάζουν.';m.classList.add('error');return;}m.textContent='Αποθήκευση…';const{error}=await client.auth.updateUser({password:p});if(error){m.textContent=error.message;m.classList.add('error');}else{m.textContent='Ο κωδικός αποθηκεύτηκε. Μπορείς να συνδεθείς.';setTimeout(()=>location.href='admin.html',1800);}});</script></body></html>
